# USF Version Definition — single source of truth.
version:
  major: 8
  minor: 0
  patch: 0
  full: "8.0.0"
  codename: "REBORN"

release:
  date: "2026-10-29"
  status: "consolidation"   # specification | alpha | beta | production | consolidation

identity:
  name: "USF — Unified Superintelligence Framework"
  one_line: "A universal product-forge: a vision in any domain goes in; a fully fleshed-out product comes out."
  thesis: "Bounded self-improvement — a well-structured reasoning methodology that converges to a stable fixed point as long as its capability scope stays constant."

lineage:
  # The PUBLIC identity (github.com/veil-protocol/usf + the published paper) is 4.1.1.
  # Internal development reached 6.9 (hardened spine) and a 7.0 build that was
  # abandoned (broken wiring + security regressions + pentest entanglement).
  # 8.0 REBORN is the consolidation: the published spec, made to actually RUN.
  public_predecessor: "USF 4.1.1 (SKYNET-HARDENED)"   # the paper's reference release
  internal_high_water: "USF 6.9 OMEGA (hardened spine) / 7.0 (reverted)"
  evolution_type: "consolidation + wiring"
  bridge: "4.1.1 (paper) -> [5.x PROMETHEUS/TITAN/FORGE, 6.x wiring, 7.0 patterns] -> 8.0 REBORN"
  reclaims: "the aspirational 'v8.0 ASCENSION' name — this is the real one, and it runs."

principle:
  # The one finding that defines this release.
  observation: "Every prior USF was ~80% specification, ~20% wired."
  commitment: "Specification that runs: consolidate, WIRE, honest-scope. Every feature is either connected or honestly cut."

scope_excluded:
  - "OMEGA pentest engine (attack MCP tools, OODA/genetic/C2, TERROR-NEXUS) — a separate solution."
  - "ENGINE-15 Distributed Context (theoretical, WONTFIX)."
  - "ENGINE-16..20 ASCENSION (aspirational benchmark names, no code)."

compatibility:
  minimum_version: "4.0.0"
  recommended_version: "8.0.0"

      prompt_template: |
        You are a verification agent running CHAIN-A.
        Task: {task}
        Verify using a single authoritative source.
      subagent_type: "general-purpose"

    - id: "chain-b"
      name: "Dual Source Verification"
      description: "CHAIN-B: Two independent sources"
      prompt_template: |

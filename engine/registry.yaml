technology:

  # ---------------------------------------------------------------------------
  # SECURITY - Reconnaissance (15 agents)
  # ---------------------------------------------------------------------------
  security_reconnaissance:
    - id: "recon-nmap-quick"
      name: "Quick Port Scanner"
      description: "Fast top-1000 port scan"
      prompt_template: |
        You are a network reconnaissance specialist.
        Task: {task}
        Perform a quick nmap scan of the top 1000 ports.
        Report open ports, services, and initial findings.
      subagent_type: "general-purpose"
      tools: ["Bash"]
      timeout_ms: 120000

    - id: "recon-nmap-full"
      name: "Full Port Scanner"
      description: "Complete 65535 port scan with version detection"
      prompt_template: |
        You are a thorough network scanner.
        Task: {task}
        Perform a full port scan (-p-) with version detection (-sV).
        Include OS fingerprinting if possible.
      subagent_type: "general-purpose"
      tools: ["Bash"]
      timeout_ms: 600000

    - id: "recon-gobuster-dir"
      name: "Directory Bruteforcer"
      description: "Web directory enumeration"
      prompt_template: |
        You are a web directory enumeration specialist.
        Task: {task}
        Use gobuster with common.txt wordlist.
        Include extensions: php, txt, html, asp, aspx.
      subagent_type: "general-purpose"
      tools: ["Bash"]
      timeout_ms: 300000

    - id: "recon-subdomain"
      name: "Subdomain Enumerator"
      description: "Subdomain discovery"
      prompt_template: |
        You are a subdomain enumeration specialist.
        Task: {task}
        Use multiple techniques: DNS bruteforce, certificate transparency.
      subagent_type: "general-purpose"
      tools: ["Bash", "WebFetch"]
      timeout_ms: 300000

    - id: "recon-whois"
      name: "WHOIS Researcher"
      description: "Domain registration research"
      prompt_template: |
        You research domain registration details.
        Task: {task}
        Extract registrant info, nameservers, creation dates.
      subagent_type: "general-purpose"

      prompt_template: |
        You are a verification agent running CHAIN-F.
        Task: {task}
        Apply deep domain expertise.
      subagent_type: "general-purpose"

    - id: "chain-g"
      name: "Temporal Verification"
      description: "CHAIN-G: Time-based validity"
      prompt_template: |
        You are a verification agent running CHAIN-G.
        Task: {task}
        Verify temporal aspects and currency.
      subagent_type: "general-purpose"

    - id: "chain-h"
      name: "Consensus Verification"
      description: "CHAIN-H: Multi-agent consensus"
      prompt_template: |
        You are a verification agent running CHAIN-H.
        Task: {task}
        Provide independent assessment for consensus.
      subagent_type: "general-purpose"

    - id: "chain-i"
      name: "Streaming Verification"
      description: "CHAIN-I: Incremental with early exit"
      prompt_template: |
        You are a verification agent running CHAIN-I.
        Task: {task}
        Provide incremental verification with confidence updates.
      subagent_type: "general-purpose"

